
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Strategy Tree Planner</title>
  <link rel="stylesheet" href="../static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body>

  <header>
    <h1 style="font-size: 30px; font-family:Arial, Helvetica, sans-serif; letter-spacing: 5px;">
      Strategy Tree Planner :: Settings </h1>
    <div class="toolbar">
      <a href="../index.html">Back</a>
    </div>
  </header>

  <div class="underheader">
    <div class="key-info" style="border-right: 1px solid var(--accent);">
          <b>Theme:</b>
            <select id="themeSelect">
              <option value="">Choose Theme</option>
              <option value="dark-theme">Dark</option>
              <option value="light-theme">Light</option>
              <option value="halloween-theme">Halloween 🎃</option>
              <option value="winter-theme">Winter</option>
            </select>

    </div>
    <div class="key-info">
        <b>Output Settings</b>
        <b>Letter size:</b>
        <select id="sizeSelect">
            <option value="">12</option>
        </select>
    </div>
  </div>
  
<footer class="footer">
    <p>Strategy planner v0.0.4</p>
    <div class="icons">
      <a href="https://github.com/LucR31/strategy_tree_planner">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://discord.gg/aZRSXdEb">
        <i class="fa-brands fa-discord"></i>
      </a>
    </div>
</footer>
<script src="../scripts/theme.js"></script>
</body>
</html>
