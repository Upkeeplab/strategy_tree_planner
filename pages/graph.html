<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <title>Strategy Planner</title>
  <link rel="stylesheet" href="../static/style.css">
</head>

<body>
  <header>
    <h1 style="font-size: 30px; font-family:Arial, Helvetica, sans-serif; letter-spacing: 5px;">
      Strategy Planner :: Graph </h1>
    <div class="toolbar">
      <a href="../index.html">Back</a>
    </div>
  </header>

  <!-- direction toggle -->
  <div class="note" style="margin-left: 40px; border-left: none;">
    <label class="switch">
      <input type="checkbox" id="directionToggle">
      <span class="slider">
        <span class="label-left">LR</span>
        <span class="label-right">TB</span>
      </span>
    </label>
  </div>

  <!-- Graph -->
  <div id="graph"></div>

  <!-- Footer -->
  <footer class="footer">
      <p>Strategy planner v<span id="app-version"></span></p>
      <div class="icons">
        <a href="https://github.com/LucR31/strategy_tree_planner">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="https://discord.gg/aZRSXdEb">
          <i class="fa-brands fa-discord"></i>
        </a>
      </div>
  </footer>

  <!-- scripts -->
  <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2/viz.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2/full.render.js"></script>
  <script src="../scripts/parser.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../config.js"></script>
  <script>
    let rankDirection = "LR";
    document.getElementById("directionToggle")
      .addEventListener("change", function () {
        rankDirection = this.checked ? "TB" : "LR";
        renderGraph();
    });
  </script>

</body>
</html>
