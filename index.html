
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategy Planner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="static/style.css">
</head>

<body>
  <header>
      <h1 style="font-size: 30px; font-family:Arial, Helvetica, sans-serif; letter-spacing: 5px;">
        Strategy planner
      </h1>
      <div class="toolbar">
        <a href="pages/guide.html">
          Docs
        </a>
        <a href="pages/settings.html">
          Settings
        </a>
      </div>
  </header>
  
  <div class="underheader">
    <div class="key-info" style="border-right: 1px solid var(--accent);">
          <b>Input</b>

          <div class="right">
            shortcuts:  
            <span class = "highlight">key</span>
            <span class = "highlight">status</span>
            <span class = "highlight">today</span>
          </div>

          <a href="pages/guide.html#keyboard-shortcuts" style="font-size: 15px;">
             <i class="fa-solid fa-arrow-up-right-from-square"></i>
             for more
          </a>
    </div>
    <div class="key-info">
        <b>Output</b>
        <div calss = "right">
            <button id = "renderBtn" class="tooltip-btn">
              <i class="fa-solid fa-diagram-project"></i>
              <span class="tooltip">Generate graph</span>
            </button>
            <button id="saveBtn" class="tooltip-btn">
              <i class="fa-sharp fa-solid fa-floppy-disk"></i>
              <span class="tooltip">Save file</span>
            </button>
            <button id="loadBtn" class="tooltip-btn">
              <i class="fa-sharp fa-solid fa-file-import"></i>
              <span class="tooltip">Load file</span>
            </button>
            <button id="exportBtn" class="tooltip-btn">
              <i class="fa-sharp fa fa-download"></i>
              <span class="tooltip">Export data</span>
            </button>
            <button  id="sampleBtn" class="tooltip-btn">
              <i class="fa-sharp fa-solid fa-trash-can"></i>
              <span class="tooltip">Delete everything</span>
            </button>
        </div>
    </div>
  </div>

  <main>
    <section class="editor-panel">
      <textarea id="editor" spellcheck="false"></textarea>
      <div id="suggestions"></div>
    </section>

    <section class="preview-panel">
      <div id="preview"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>Strategy planner v<span id="app-version"></span></p>
    <div class="icons">
      <a href="https://github.com/LucR31/strategy_tree_planner">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://discord.gg/aZRSXdEb">
        <i class="fa-brands fa-discord"></i>
      </a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/textarea-caret@3.0.0/index.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/script_dropdown.js"></script>
  <script src="scripts/theme.js"></script>
  <script>
    const fontSize = localStorage.getItem("printFontSize") || "9";
    document.documentElement.style.setProperty(
    "--print-font-size",
    `${fontSize}pt`);
  </script>
  <script src="config.js"></script>


</body>
</html>
