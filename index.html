
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategy Tree Planner</title>
  <link rel="stylesheet" href="static/style.css">
</head>

<body>
  <header>
    <h1>Strategy Tree Planner v0.0.1</h1>

    <div class="key-info">
    Key words:  
    <span class = "highlight">key</span>
    <span class = "highlight">status</span>
    <span class = "highlight">symbol</span>
    <span class = "highlight">time</span>
    </div>

    <div class="toolbar">
      <a href="pages/guide.html" style="color: white;">How to</a>
      <button id="saveBtn">Save</button>
      <button id="loadBtn">Load</button>
      <button id="exportBtn">Export PDF</button>
      <button id="sampleBtn">Load Example</button>
    </div>

  </header>
 
  <main>
    <section class="editor-panel">
      <textarea id="editor" spellcheck="false"></textarea>
      <div id="suggestions"></div>
    </section>

    <section class="preview-panel">
      <div id="preview"></div>
    </section>
  </main>

  <script src="https://unpkg.com/textarea-caret@3.0.0/index.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/script_dropdown.js"></script>

</body>
</html>
