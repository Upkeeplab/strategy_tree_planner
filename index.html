
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategy Tree Planner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="static/style.css">
</head>

<body>
  <header>
      <h1 style="font-size: 30px; font-family:Arial, Helvetica, sans-serif; letter-spacing: 5px;">
        Strategy planner
      </h1>
      <div class="toolbar">
        <a href="pages/guide.html">
          Docs
        </a>
        <a href="pages/settings.html">
          Settings
        </a>
      </div>
  </header>
  
  <div class="underheader">
    <div class="key-info" style="border-right: 1px solid var(--accent);">
          <b>Input</b>
          <div class="right">
            Shortcuts:  
            <span class = "highlight">key</span>
            <span class = "highlight">status</span>
            <span class = "highlight">sym</span>
            <span class = "highlight">time</span>
            <span class = "highlight">today</span>
          </div>
    </div>
    <div class="key-info">
        <b>Output</b>
        <div calss = "right">
            <button id="saveBtn" class="tooltip-btn">
              <i class="fa-sharp fa-solid fa-floppy-disk"></i>
              <span class="tooltip">Save file</span>
            </button>
            <button id="loadBtn" class="tooltip-btn">
              <i class="fa-sharp fa-solid fa-file-import"></i>
              <span class="tooltip">Load file</span>
            </button>
            <button id="exportBtn" class="tooltip-btn">
              <i class="fa-sharp fa fa-download"></i>
              <span class="tooltip">Export data</span>
            </button>
            <button  id="sampleBtn" class="tooltip-btn">
              <i class="fa-sharp fa-solid fa-trash-can"></i>
              <span class="tooltip">Delete everything</span>
            </button>
        </div>
    </div>
  </div>

  <main>
    <section class="editor-panel">
        <textarea id="editor" spellcheck="false"></textarea>
        <div id="suggestions"></div>
    </section>

    <section class="preview-panel">
      <div id="preview"></div>
    </section>
  </main>

  <script src="https://unpkg.com/textarea-caret@3.0.0/index.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/script_dropdown.js"></script>
  <script src="scripts/theme.js"></script>

  <footer class="footer">
    <p>Strategy planner v0.0.1</p>

    <div class="icons">
      <a href="#"><i class="fa-brands fa-github"></i></a>
    </div>

  </footer>

</body>
</html>
