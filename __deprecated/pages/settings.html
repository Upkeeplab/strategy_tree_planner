<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategy Planner</title>
  <link rel="stylesheet" href="../static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<style>
  body {
    padding: 40px;
    max-width: 1000px;
  }
</style>

<body>

  <header>
    <h1 style="font-size: 30px; font-family:Arial, Helvetica, sans-serif; letter-spacing: 5px;">
      Strategy Tree Planner :: Settings </h1>
    <div class="toolbar">
      <a href="../index.html">Back</a>
    </div>
  </header>

  <div class="note">
    <h3>General</h3>
    <b>Theme:</b>
    <select id="themeSelect">
      <option value="">Choose Theme</option>
      <option value="dark-theme">Dark</option>
      <option value="light-theme">Light</option>
      <option value="halloween-theme">Halloween 🎃</option>
      <option value="winter-theme">Winter</option>
    </select>

  </div>

  <div class="note">
    <h3>Output Settings</h3>
    <b>Letter size:</b>
    <input id="fontSizeInput" type="number" value="9" min="6" max="40"/>
  </div>


<!-- footer --> 
<footer class="footer">
    <p>Strategy planner v<span id="app-version"></span></p>
    <div class="icons">
      <a href="https://github.com/LucR31/strategy_tree_planner">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://discord.gg/aZRSXdEb">
        <i class="fa-brands fa-discord"></i>
      </a>
    </div>
</footer>

<!-- Scripts -->
<script src="../scripts/theme.js"></script>
<script src="../config.js"></script>
<script>
    const input = document.getElementById("fontSizeInput");
    input.value = localStorage.getItem("printFontSize") || "9";
    input.addEventListener("input", () => {
    localStorage.setItem(
        "printFontSize",
        input.value);
    });
</script>

</body>
</html>
